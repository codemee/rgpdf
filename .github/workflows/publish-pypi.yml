name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Generate Windows icon
        run: uv run --frozen python scripts/generate_windows_icon.py
      - name: Build single-file executable
        run: uv run --frozen pyinstaller --noconfirm --clean rgpdf.spec
      - name: Smoke test executable
        shell: pwsh
        run: |
          try {
            Start-Process -FilePath dist\rgpdf.exe
            Start-Sleep -Seconds 8
            $processes = Get-Process -Name rgpdf -ErrorAction SilentlyContinue
            $visible = $processes | Where-Object {
              $_.MainWindowHandle -ne 0 -and $_.Responding
            }
            if (-not $visible) {
              throw "rgpdf.exe did not create a responsive window"
            }
          } finally {
            Get-Process -Name rgpdf -ErrorAction SilentlyContinue |
              Stop-Process -Force
          }
      - name: Prepare versioned download
        shell: pwsh
        run: |
          $version = uv run --frozen python -c "from rgpdf import __version__; print(__version__)"
          $filename = "rgpdf-$version-windows-x86_64.exe"
          Copy-Item dist\rgpdf.exe "dist\$filename"
          $hash = (Get-FileHash "dist\$filename" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $filename" | Set-Content "dist\$filename.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: rgpdf-windows-x86_64
          if-no-files-found: error
          path: |
            dist/rgpdf-*-windows-x86_64.exe
            dist/rgpdf-*-windows-x86_64.exe.sha256
            LICENSE
            THIRD-PARTY-NOTICES.md
      - name: Attach unsigned executable to GitHub Release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            (Get-ChildItem dist\rgpdf-*-windows-x86_64.exe).FullName
            (Get-ChildItem dist\rgpdf-*-windows-x86_64.exe.sha256).FullName
            (Resolve-Path LICENSE).Path
            (Resolve-Path THIRD-PARTY-NOTICES.md).Path
          )
          gh release upload "${{ github.event.release.tag_name }}" $assets --clobber

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build wheel and source distribution
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rgpdf/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
