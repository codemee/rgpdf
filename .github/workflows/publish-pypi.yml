name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Match package version to tag
        shell: python
        run: |
          import os
          import pathlib
          import tomllib

          root = pathlib.Path.cwd()
          project_version = tomllib.loads((root / "pyproject.toml").read_text())["project"]["version"]
          namespace = {}
          exec((root / "src/rgpdf/__init__.py").read_text(), namespace)
          package_version = namespace["__version__"]
          tag_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if len({project_version, package_version, tag_version}) != 1:
              raise SystemExit(
                  f"Version mismatch: tag={tag_version}, pyproject={project_version}, package={package_version}"
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"version={tag_version}", file=output)

  prepare-release:
    name: Prepare draft Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create or resume the draft for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py prepare --tag "$GITHUB_REF_NAME" --sha "$GITHUB_SHA"

  build-windows:
    name: Build Windows x86_64
    needs: [validate, prepare-release]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run --frozen pytest
      - name: Build executable
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Python .venv/Scripts/python.exe
      - name: Smoke test extracted folder bundle and IPC
        shell: pwsh
        run: |
          $expanded = Join-Path $env:RUNNER_TEMP 'rgpdf-release-smoke'
          Expand-Archive -LiteralPath "dist\rgpdf-${{ needs.validate.outputs.version }}-windows-x86_64.zip" -DestinationPath $expanded
          ./scripts/test-windows-startup.ps1 -Binary (Join-Path $expanded 'rgpdf\rgpdf.exe')
      - name: Upload Windows assets directly to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          .venv/Scripts/python.exe scripts/release.py upload --tag $env:GITHUB_REF_NAME --sha $env:GITHUB_SHA --files "dist/rgpdf-${{ needs.validate.outputs.version }}-windows-x86_64.zip" "dist/rgpdf-${{ needs.validate.outputs.version }}-windows-x86_64.zip.sha256"

  build-macos:
    name: Build macOS arm64
    needs: [validate, prepare-release]
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Require Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run --frozen pytest
      - name: Build App
        run: ./scripts/build-macos.sh
      - name: Smoke test App
        run: uv run --frozen python scripts/test_macos_startup.py dist/rgpdf.app/Contents/MacOS/rgpdf
      - name: Verify and package App as DMG
        shell: bash
        run: |
          codesign --verify --deep --strict dist/rgpdf.app
          filename="rgpdf-${{ needs.validate.outputs.version }}-macos-arm64.dmg"
          VERSION="${{ needs.validate.outputs.version }}" ARCH=arm64 \
            ./scripts/package-macos-dmg.sh "dist/$filename"
          cd dist
          shasum -a 256 "$filename" > "$filename.sha256"
      - name: Upload macOS assets directly to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .venv/bin/python scripts/release.py upload --tag "$GITHUB_REF_NAME" --sha "$GITHUB_SHA" --files "dist/rgpdf-${{ needs.validate.outputs.version }}-macos-arm64.dmg" "dist/rgpdf-${{ needs.validate.outputs.version }}-macos-arm64.dmg.sha256"

  package-python:
    name: Build Python and source distributions
    needs: [validate, prepare-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Build wheel and source distribution
        run: uv build
      - name: Create corresponding source archive
        run: |
          git archive \
            --format=tar.gz \
            --prefix="rgpdf-${{ needs.validate.outputs.version }}/" \
            --output="dist/rgpdf-${{ needs.validate.outputs.version }}-source.tar.gz" \
            HEAD
          cd dist
          sha256sum "rgpdf-${{ needs.validate.outputs.version }}-source.tar.gz" \
            > "rgpdf-${{ needs.validate.outputs.version }}-source.tar.gz.sha256"
      - name: Upload project sources directly to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release.py upload --tag "$GITHUB_REF_NAME" --sha "$GITHUB_SHA" --files "dist/rgpdf-${{ needs.validate.outputs.version }}-source.tar.gz" "dist/rgpdf-${{ needs.validate.outputs.version }}-source.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/rgpdf-${{ needs.validate.outputs.version }}-*.whl
            dist/rgpdf-${{ needs.validate.outputs.version }}.tar.gz

  package-third-party-sources:
    name: Package corresponding third-party sources
    needs: [validate, prepare-release]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .cache/third-party-sources
          key: third-party-sources-v1-${{ hashFiles('third-party-sources.toml', 'scripts/package_third_party_sources.py') }}
      - name: Download, verify, and package sources
        run: |
          python scripts/package_third_party_sources.py \
            --project-version "${{ needs.validate.outputs.version }}" \
            --output-dir dist --cache-dir .cache/third-party-sources
      - name: Upload third-party sources directly to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release.py upload --tag "$GITHUB_REF_NAME" --sha "$GITHUB_SHA" --files "dist/rgpdf-${{ needs.validate.outputs.version }}-third-party-sources.tar.gz" "dist/rgpdf-${{ needs.validate.outputs.version }}-third-party-sources.tar.gz.sha256"

  release:
    name: Publish GitHub Release
    needs: [validate, prepare-release, build-windows, build-macos, package-python, package-third-party-sources]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Verify complete assets and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release.py publish --tag "$GITHUB_REF_NAME" --sha "$GITHUB_SHA"

  publish-pypi:
    name: Publish to PyPI
    needs: [release, package-python]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rgpdf/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
